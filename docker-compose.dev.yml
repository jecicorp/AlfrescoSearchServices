---
# Development stack: Alfresco + Solr (pure) + Trackers (Spring Boot)
services:
  proxy:
    image: docker.io/caddy:2.11.2-alpine
    mem_limit: 50m
    ports:
      - "8080:80"
      - "8984:8984"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
    depends_on:
      - alfresco
      - solr
      - pristy-portail
      - pristy-espaces
    networks:
      - backend

  postgres:
    image: docker.io/postgres:17.9
    mem_limit: 250m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "alfresco"]
      interval: 10s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=100 -c log_min_messages=LOG
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - backend

  alfresco:
    build:
      context: ./acs
      args:
        ACS_TAG: "25.3.0"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 10s
      retries: 10
      start_period: 30s
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.host=solr
        -Dsolr.port=8983
        -Dalfresco.host=alfresco
        -Dalfresco.port=8080
        -Dtransform.service.enabled=false
        -Dlocal.transform.service.enabled=false
        -Dcsrf.filter.enabled=false
        -Dencryption.keystore.type=JCEKS
        -Dencryption.keystore.location=classpath:alfresco/keystore/keystore
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  solr:
    build:
      context: search-services/packaging/target/docker-resources
      dockerfile: Dockerfile
    mem_limit: 2g
    entrypoint: ["/opt/alfresco-search-services/solr-init-core.sh"]
    environment:
      SOLR_ALFRESCO_HOST: alfresco
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: solr
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco
      ALFRESCO_SECURE_COMMS: secret
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=secret"
    ports:
      - "8983:8983"
    depends_on:
      alfresco:
        condition: service_healthy
    volumes:
      - solr-data-volume:/opt/alfresco-search-services/data
      - solr-solrhome-volume:/opt/alfresco-search-services/solrhome
    networks:
      - backend

  trackers:
    build:
      context: search-services/alfresco-indexing-trackers/target
      dockerfile: ../../packaging/src/docker/Dockerfile.trackers
    mem_limit: 512m
    environment:
      ALFRESCO_TRACKER_SOLR_URL: http://solr:8983/solr
      ALFRESCO_TRACKER_SOLR_COLLECTION: alfresco
      ALFRESCO_TRACKER_REPOSITORY_URL: http://alfresco:8080/alfresco
      ALFRESCO_TRACKER_REPOSITORY_SECURECOMMS: secret
      ALFRESCO_TRACKER_REPOSITORY_SHAREDSECRET: secret
    ports:
      - "8085:8085"
    depends_on:
      alfresco:
        condition: service_healthy
    networks:
      - backend

  pristy-portail:
    image: rg.fr-par.scw.cloud/pristy/pristy-portail:1.3.0
    mem_limit: 50m
    volumes:
      - ./public/env-config-portail.json:/srv/env-config.json:ro
    depends_on:
      - alfresco
    networks:
      - backend

  pristy-espaces:
    image: rg.fr-par.scw.cloud/pristy/pristy-espaces:1.14.0
    mem_limit: 50m
    volumes:
      - ./public/env-config-espaces.json:/srv/env-config.json:ro
    depends_on:
      - alfresco
    networks:
      - backend

  transform-core-aio:
    image: docker.io/alfresco/alfresco-transform-core-aio:5.4.0
    mem_limit: 1g
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
    depends_on:
      - alfresco
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-volume:
  solr-data-volume:
  solr-solrhome-volume:
