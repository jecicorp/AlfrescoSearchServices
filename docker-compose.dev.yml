services:
  alfresco:
    image: alfresco/alfresco-content-repository-community:23.4.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
    ports:
      - "8080:8080"

  solr:
    build:
      context: search-services/packaging/target/docker-resources
      dockerfile: Dockerfile
    environment:
      SOLR_ALFRESCO_HOST: alfresco
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco
      ALFRESCO_SECURE_COMMS: secret
      ALFRESCO_SECURE_COMMS_SECRET: secret
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/opt/alfresco-search-services/data

  trackers:
    build:
      context: search-services/alfresco-indexing-trackers/target
      dockerfile: ../../packaging/src/docker/Dockerfile.trackers
    environment:
      ALFRESCO_TRACKER_SOLR_URL: http://solr:8983/solr
      ALFRESCO_TRACKER_SOLR_COLLECTION: alfresco
      ALFRESCO_TRACKER_REPOSITORY_URL: http://alfresco:8080/alfresco
    ports:
      - "8085:8085"
    depends_on:
      - solr
      - alfresco

volumes:
  solr-data:
