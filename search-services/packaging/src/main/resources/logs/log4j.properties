# Alfresco Solr log4j2 config (log4j2.properties format — Solr 9 ships log4j2).
# rootLogger level may be programmatically overridden by -Dsolr.log.level
status = warn
name = AlfrescoSolrLog4j2

property.solr.log = ${sys:solr.log.dir}

# Console appender (disabled programmatically when Solr starts with -Dsolr.log.muteconsole)
appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p (%t) [%X{collection} %X{shard} %X{replica} %X{core}] %c{1.} %m%n

# Size-based rotation with log cleanup
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = ${solr.log}/solr.log
appender.file.filePattern = ${solr.log}/solr.log.%i
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p (%t) [%X{collection} %X{shard} %X{replica} %X{core}] %c{1.} %m%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 4MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 9

# Adjust logging levels that should differ from root logger
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN
logger.jettyserver.name = org.eclipse.jetty.server.Server
logger.jettyserver.level = INFO
logger.jettyconnector.name = org.eclipse.jetty.server.ServerConnector
logger.jettyconnector.level = INFO

logger.infostream.name = org.apache.solr.update.LoggingInfoStream
logger.infostream.level = OFF
logger.fieldtypeloader.name = org.apache.solr.schema.FieldTypePluginLoader
logger.fieldtypeloader.level = ERROR
logger.httpclient.name = org.apache.commons.httpclient
logger.httpclient.level = WARN
logger.dispatchfilter.name = org.apache.solr.servlet.SolrDispatchFilter
logger.dispatchfilter.level = INFO
logger.alfrescosolr.name = org.alfresco.solr
logger.alfrescosolr.level = WARN

rootLogger.level = WARN
rootLogger.appenderRef.file.ref = file
rootLogger.appenderRef.console.ref = CONSOLE
