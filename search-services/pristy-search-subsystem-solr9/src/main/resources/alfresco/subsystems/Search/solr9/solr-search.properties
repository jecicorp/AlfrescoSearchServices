# "solr9" Search subsystem defaults.
#
# Mirrors the stock solr6 defaults, plus the settings for the separate
# admin-actions channel that targets the Alfresco Indexing Trackers service.

solr.host=localhost
# Vanilla Solr 9 default port (solr6 subsystem historically defaulted to 8083).
solr.port=8983
solr.port.ssl=8446
solr.query.includeGroupsForRoleAdmin=false
solr.query.maximumResultsFromUnlimitedQuery=${system.acl.maxPermissionChecks}
solr.baseUrl=/solr

solr.defaultUnshardedFacetLimit=100
solr.defaultShardedFacetLimit=20

solr.useDynamicShardRegistration=false

#
# Trackers admin-actions channel
# ------------------------------------------------------------------
# SUMMARY / REPORT / NODEREPORT / REINDEX / ... are served by the standalone
# trackers service (Solr-compat alias GET /solr/admin/cores?action=...), not by
# vanilla Solr. Point the Alfresco admin HTTP client there.
#
# secureComms / sharedSecret default to the same values as the Solr channel, so
# a single-secret deployment needs no extra config. Override these only if the
# trackers admin server (:8085) uses a different secret or TLS material.
solr.tracker.host=localhost
solr.tracker.port=8085
solr.tracker.port.ssl=8085
solr.tracker.secureComms=${solr.secureComms}
solr.tracker.sharedSecret=${solr.sharedSecret}

#
# Solr Suggester properties
#
solr.suggester.enabled=true
#
# Default unsharded

solr9.alfresco.nodeString=
solr9.alfresco.numShards=1
solr9.alfresco.replicationFactor=1

solr9.archive.nodeString=
solr9.archive.numShards=1
solr9.archive.replicationFactor=1

# NOTE: the store mappings (workspace + archive) are defined directly in the
# solr9.store.mappings ListFactoryBean in solr-search-context.xml. solr9.store.mappings
# is deliberately NOT a composite property (see solr9-subsystem-context.xml), so no
# solr9.store.mappings.* properties are needed here — a composite would be populated only
# from global properties and would override the inline sourceList with an empty list.

# SOLR Http Client Factory Properties
solr.http.socket.timeout=2000
solr.http.connection.timeout=500
