alfresco:
  tracker:
    solr:
      url: http://localhost:8983/solr
      collection: alfresco
      collections: alfresco,archive
      secure-comms: none          # none | secret | https
      shared-secret: ""
      ssl:
        key-store: ""
        key-store-password: ""
        key-store-type: PKCS12
        trust-store: ""
        trust-store-password: ""
        trust-store-type: PKCS12
    repository:
      url: http://localhost:8080/alfresco
      secure-comms: none          # none | secret | https
      shared-secret: ""
      ssl:
        key-store: ""
        key-store-password: ""
        key-store-type: PKCS12
        trust-store: ""
        trust-store-password: ""
        trust-store-type: PKCS12
    cron:
      metadata: "0/5 * * * * ?"
      acl: "0/5 * * * * ?"
      content: "0/20 * * * * ?"
      commit: "0/5 * * * * ?"
      model: "0/10 * * * * ?"
      cascade: "0/10 * * * * ?"
    batch-count: 5000
    cascade-tracking-enabled: true
    solr-home: /opt/solr/data
    health:
      connect-timeout: 5000   # ms — repository health probe (/actuator/health)
      read-timeout: 5000      # ms

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,repairreport
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.alfresco: INFO
    org.apache.solr: WARN
