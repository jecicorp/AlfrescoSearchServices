alfresco:
  tracker:
    solr:
      url: http://localhost:8983/solr
      collection: alfresco
      collections: alfresco,archive
      secure-comms: none          # none | secret | https
      shared-secret: ""
      ssl:
        key-store: ""
        key-store-password: ""
        key-store-type: PKCS12
        trust-store: ""
        trust-store-password: ""
        trust-store-type: PKCS12
    repository:
      url: http://localhost:8080/alfresco
      secure-comms: none          # none | secret | https
      shared-secret: ""
      ssl:
        key-store: ""
        key-store-password: ""
        key-store-type: PKCS12
        trust-store: ""
        trust-store-password: ""
        trust-store-type: PKCS12
    cron:
      metadata: "0/5 * * * * ?"
      acl: "0/5 * * * * ?"
      content: "0/20 * * * * ?"
      commit: "0/5 * * * * ?"
      model: "0/10 * * * * ?"
      cascade: "0/10 * * * * ?"
    batch-count: 5000
    cascade-tracking-enabled: true
    solr-home: /opt/solr/data
    health:
      connect-timeout: 5000   # ms — repository health probe (/actuator/health)
      read-timeout: 5000      # ms
    backup:
      enabled: false                # opt-in; set true to schedule backups
      cron: "0 0 2 1 * ?"           # monthly, 1st of the month at 02:00
      location: /backup/solr        # MUST be a dedicated volume, separate from the
                                     # index data dir, and listed in solr.allowPaths
                                     # (see Dockerfile / deployment env)
      number-to-keep: 2             # ~2 full copies of the index kept on the backup volume

server:
  port: 8085
  ssl:
    enabled: ${TRACKER_SERVER_SSL_ENABLED:false}
    client-auth: need
    key-store: ${TRACKER_SERVER_SSL_KEY_STORE:}
    key-store-password: ${TRACKER_SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: ${TRACKER_SERVER_SSL_TRUST_STORE:}
    trust-store-password: ${TRACKER_SERVER_SSL_TRUST_STORE_PASSWORD:}
    trust-store-type: PKCS12

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,repairreport
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.alfresco: INFO
    org.apache.solr: WARN
