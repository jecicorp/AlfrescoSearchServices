---
# Pipeline for https://gitlab.com/pristy-oss/pristy-search-services
#
# Runs on the runners dedicated to the public Pristy projects, tagged
# [docker, pristy] — distinct from the [docker, jeci] runners used by the private
# projects. Only the jobs that consume protected variables (Docker Hub) are
# restricted to develop / stable / tags.
#
# ci_settings.xml deliberately holds no private mirror and no credential:
# dependencies resolve from Maven Central and artifacts.alfresco.com, so
# building, testing and scanning need no secret at all.
stages:
  - build
  - security
  - docker
  - deploy

# Avoid duplicate pipelines: run the MR pipeline OR the branch pipeline, not both.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

default:
  image: docker.io/maven:3.9-eclipse-temurin-17
  tags:
    - docker
    - pristy

variables:
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode --errors --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  # The e2e-test module needs a full ACS + Solr + Postgres stack (see
  # e2e-test/README.md), so it cannot run here and is excluded from the reactor
  # everywhere. Run its tests by hand with `mise run e2e:test`.
  MAVEN_REACTOR: "-pl !e2e-test"
  DOCKER_NAMESPACE: jeci

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

####
## Build + unit tests ##
##

# -DskipITs: the failsafe (`*IT`) suite of pristy-search boots an embedded Solr
# core and is currently failing (see the integration-tests job). It was never part
# of what `mise run test` executes, which stops at surefire. This job therefore
# stays the blocking gate on the unit tests.
maven-build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS verify -DskipITs $MAVEN_REACTOR
  artifacts:
    paths:
      # Solr Docker context: Maven-filtered Dockerfile + distribution zip + scripts
      - "search-services/packaging/target/docker-resources/"
      # Trackers Spring Boot JAR (Dockerfile.trackers lives in the repository)
      - "search-services/pristy-indexing-trackers/target/pristy-indexing-trackers-*.jar"
      - "**/target/surefire-reports/"
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    expire_in: 1 week

# Integration suite (embedded Solr core), NON blocking and expected to be red.
# It exists to make the state visible and to measure progress, not to guard the
# branch. Fold it into maven-build (and drop allow_failure) once it passes.
# -Dtest.solr.allowed.securerandom is the bypass Solr recommends when the runner
# JVM exposes NativePRNG, without which SolrTestCaseJ4 refuses to start.
integration-tests:
  stage: build
  allow_failure: true
  # There is no "only the ITs" flag: surefire exposes skipTests, which failsafe
  # honours too. So this job reruns the whole suite — runner time, not a risk,
  # and it blocks nothing.
  script:
    - mvn $MAVEN_CLI_OPTS verify $MAVEN_REACTOR
      -Dtest.solr.allowed.securerandom=NativePRNG
  artifacts:
    when: always
    paths:
      - "**/target/failsafe-reports/"
    reports:
      junit: "**/target/failsafe-reports/TEST-*.xml"
    expire_in: 1 week

####
## Security: SBOM + vulnerability scan ##
##

# Two CycloneDX SBOMs, same split as pristy-core.
#   - bom-runtime: compile scope -> what our JARs actually ship, and therefore
#     what we can fix from this repository.
#   - bom-full:    compile + provided -> what really runs, including the JARs
#     provided by Solr 9 and by the Alfresco repository.
sbom:
  stage: security
  script:
    - mvn $MAVEN_CLI_OPTS $MAVEN_REACTOR org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
      -DoutputFormat=json -DoutputName=bom-runtime
      -DincludeProvidedScope=false -DincludeTestScope=false
    - mvn $MAVEN_CLI_OPTS $MAVEN_REACTOR org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
      -DoutputFormat=json -DoutputName=bom-full
      -DincludeProvidedScope=true -DincludeTestScope=false
  artifacts:
    paths:
      - target/bom-runtime.json
      - target/bom-full.json
    expire_in: 1 week

# Only the runtime SBOM fails the pipeline. Blocking on the full tree would keep
# it permanently red on CVEs we cannot fix here: those are remediated by moving
# to another Solr or Alfresco version, not by anything under src/.
dependency-scan:
  stage: security
  image:
    name: docker.io/aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - job: sbom
      artifacts: true
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  # Overrides the global .m2 cache, which this job does not need.
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    # Informative: the whole runtime tree, reported but never blocking.
    - trivy sbom --quiet --format json --output trivy-full.json target/bom-full.json
    - trivy convert --quiet --format table --severity HIGH,CRITICAL trivy-full.json
    # Blocking: only the JARs we distribute.
    - trivy sbom --quiet --format json --output trivy-runtime.json target/bom-runtime.json
    - trivy convert --quiet --format table --severity CRITICAL --exit-code 1 trivy-runtime.json
  artifacts:
    when: always
    paths:
      - trivy-full.json
      - trivy-runtime.json
    expire_in: 1 week

####
## Docker images -> Docker Hub (jeci/) ##
##

.kaniko:
  stage: docker
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.2-debug
    entrypoint: [""]
  needs:
    - job: maven-build
      artifacts: true
  before_script:
    - >-
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USER}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
    # A Git tag publishes <version> and moves latest; a branch publishes its name.
    - if [ -n "$CI_COMMIT_TAG" ]; then IMAGE_TAGS="$CI_COMMIT_TAG latest"; else IMAGE_TAGS="$CI_COMMIT_REF_SLUG"; fi
    - DESTINATIONS=""
    - for t in $IMAGE_TAGS; do DESTINATIONS="$DESTINATIONS --destination ${DOCKER_NAMESPACE}/${IMAGE_NAME}:$t"; done
    - echo "Publishing to$DESTINATIONS"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "stable"

docker-build-solr:
  extends: .kaniko
  variables:
    IMAGE_NAME: pristy-search-services
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/search-services/packaging/target/docker-resources"
      --dockerfile "${CI_PROJECT_DIR}/search-services/packaging/target/docker-resources/Dockerfile"
      $DESTINATIONS

docker-build-trackers:
  extends: .kaniko
  variables:
    IMAGE_NAME: pristy-indexing-trackers
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/search-services/pristy-indexing-trackers/target"
      --dockerfile "${CI_PROJECT_DIR}/search-services/packaging/src/docker/Dockerfile.trackers"
      $DESTINATIONS

####
## Maven publication -> GitLab Package Registry ##
##

# Snapshots from develop, releases from a tag. The Package Registry of a public
# project is readable without authentication, which is what feeds pristy-ecm.
# Maven Central (namespace fr.pristy) is planned for 1.1.
maven-deploy:
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests $MAVEN_REACTOR
  needs:
    - job: maven-build
      artifacts: true
    - job: dependency-scan
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
