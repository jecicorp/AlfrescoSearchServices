[env]
MAVEN_CLI_OPTS = "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

[tools]
java = "temurin-17"
maven = "3.9.9"

[tasks.build]
description = "Build sans tests"
run = "mvn $MAVEN_CLI_OPTS package -Dmaven.test.skip=true"

[tasks.test]
description = "Tests unitaires (sans e2e)"
run = "mvn $MAVEN_CLI_OPTS test -pl search-services/alfresco-solrclient-lib,search-services/alfresco-search -am"

[tasks.install]
description = "Install dans le repo local (sans e2e)"
# 'clean' is required: a stale target/ (e.g. an old solr-core-8.11.4.jar left in
# the packaging libs) otherwise gets bundled into the assembled Solr webapp.
run = "mvn $MAVEN_CLI_OPTS clean install -DskipTests -pl search-services/alfresco-solrclient-lib,search-services/alfresco-search,search-services/packaging -am"

[tasks."e2e:build-image"]
description = "Construit l'image Docker locale depuis le packaging"
run = """
docker build -t alfresco/alfresco-search-services:local \
  search-services/packaging/target/docker-resources/
echo "Image Docker construite : alfresco/alfresco-search-services:local"
"""

[tasks."e2e:generate"]
description = "Génère le docker-compose pour la stack e2e"
dir = "e2e-test/python-generator"
run = """
python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=alfresco/alfresco-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --output=../../target/e2e-stack
echo "Stack générée dans target/e2e-stack/"
echo "Lancer avec : mise run e2e:up"
"""

[tasks."e2e:rebuild"]
description = "Build + regénère + redémarre la stack e2e (ordre correct)"
run = """
echo "==> Build Maven (sans tests)..."
# 'clean' avoids bundling stale jars (e.g. an old solr-core) from a previous build.
mvn $MAVEN_CLI_OPTS clean package -Dmaven.test.skip=true
echo "==> Build image Solr..."
docker build -t alfresco/alfresco-search-services:local search-services/packaging/target/docker-resources/
echo "==> Génération docker-compose e2e (copie JARs frais)..."
cd e2e-test/python-generator && python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=alfresco/alfresco-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --output=../../target/e2e-stack
cd ../..
echo "==> Redémarrage stack e2e..."
# --renew-anon-volumes: the search image declares VOLUME .../solrhome, so a reused
# anonymous volume would mask the freshly built template/config (cores are recreated
# from the template at startup).
docker compose -f target/e2e-stack/docker-compose.yml up --build --force-recreate --renew-anon-volumes -d
echo "==> Stack e2e prête."
"""

[tasks."e2e:up"]
description = "Démarre la stack e2e (ACS + Solr + Postgres)"
run = "docker compose -f target/e2e-stack/docker-compose.yml up --build -d"

[tasks."e2e:down"]
description = "Arrête la stack e2e"
run = "docker compose -f target/e2e-stack/docker-compose.yml down"

[tasks."e2e:logs"]
description = "Affiche les logs de la stack e2e"
run = "docker compose -f target/e2e-stack/docker-compose.yml logs -f"

[tasks."e2e:test"]
description = "Lance les tests e2e (stack doit être up)"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test"

[tasks."e2e:test:admin"]
description = "Tests e2e admin uniquement"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -Dtest='SolrE2eAdminTest,SolrE2ESummaryTest,SolrE2eActionTest'"

[tasks."e2e:test:search"]
description = "Tests e2e recherche (sans admin)"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -Dtest='SearchTest,SearchSimpleCasesTest,SearchCasesTest,SearchAFTSInFieldTest,SearchExactTermTest,SearchHighLightTest,SearchPermissionsTest,SearchQueryPaginationTest,SearchWithCustomModelTest,SpecialCharacterSearchTest'"

[tasks."e2e:test:facet"]
description = "Tests e2e facettes"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -Dtest='FacetedSearchTest,FacetFieldsSearchTest,FacetIntervalSearchTest,FacetRangeSearchTest,PivotFacetedSearchTest,StatsSearchTest'"

[tasks."e2e:test:class"]
description = "Lance un test e2e par nom de classe — ex: mise run e2e:test:class MyTest"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -Dtest='{{arg(name=\"class\")}}'"

[tasks."e2e:generate:https"]
description = "Generate docker-compose for the e2e stack with the Pristy https/mTLS (PKCS12) profile"
dir = "e2e-test/python-generator"
run = """
# Prerequisites: run the keystore generator first:
#   STORE_PASS=changeit keystore/generate-keystores.sh /tmp/mtls-out
# This produces solr.p12, trackers.p12, alfresco.p12 and truststore.p12 in /tmp/mtls-out.
python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=alfresco/alfresco-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --communication=https \
  --keystoreDir=/tmp/mtls-out \
  --output=../../target/e2e-stack-https
echo "https/mTLS stack generated in target/e2e-stack-https/"
echo "Start with: docker compose -f target/e2e-stack-https/docker-compose.yml up --build -d"
"""

[tasks."trackers:build"]
description = "Build trackers Spring Boot JAR"
# Run from the repo root (no `cd`): the license-maven-plugin resolves
# license-headers via ${maven.multiModuleProjectDirectory}, and with no .mvn/
# dir that property is the invocation dir. `cd search-services` would point it
# at search-services/license-headers (nonexistent) and break the build.
run = "mvn $MAVEN_CLI_OPTS package -pl search-services/alfresco-indexing-trackers -am -Dmaven.test.skip=true"

[tasks."trackers:build-image"]
description = "Construit l'image Docker des trackers depuis le JAR"
depends = ["trackers:build"]
# The Dockerfile lives outside the build context (packaging/src/docker), and the
# context is the module's target/ dir where the repackaged Spring Boot JAR sits
# (COPY alfresco-indexing-trackers-*.jar). Mirrors the compose `trackers` service.
run = """
docker build -t alfresco/alfresco-indexing-trackers:local \
  -f search-services/packaging/src/docker/Dockerfile.trackers \
  search-services/alfresco-indexing-trackers/target
echo "Image Docker construite : alfresco/alfresco-indexing-trackers:local"
"""

[tasks."trackers:run"]
description = "Run trackers locally"
# Run from the repo root — see trackers:build for why (license-headers path).
run = "mvn spring-boot:run -pl search-services/alfresco-indexing-trackers"

[tasks."dev:acs-build"]
description = "Build the solr9 subsystem JAR and stage it into acs/assets for the ACS image"
# The ACS image build context is ./acs, so the freshly built subsystem JAR must be
# copied into acs/assets/ before `docker compose build`. The JAR is a git-ignored
# build artifact (see acs/assets/.gitignore).
run = """
mvn $MAVEN_CLI_OPTS package -pl search-services/alfresco-search-subsystem-solr9 -am -Dmaven.test.skip=true
cp search-services/alfresco-search-subsystem-solr9/target/alfresco-search-subsystem-solr9.jar acs/assets/
echo "Staged alfresco-search-subsystem-solr9.jar into acs/assets/"
"""

[tasks."dev:up"]
description = "Start development stack (Alfresco + Solr + Trackers)"
depends = ["dev:acs-build"]
run = "docker compose -f docker-compose.dev.yml up --build -d"

[tasks."dev:down"]
description = "Stop development stack"
run = "docker compose -f docker-compose.dev.yml down"

[tasks."dev:logs"]
description = "View development stack logs"
run = "docker compose -f docker-compose.dev.yml logs -f"

