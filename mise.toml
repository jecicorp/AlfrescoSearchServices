[env]
MAVEN_CLI_OPTS = "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

[tools]
java = "temurin-17"
maven = "3.9.9"
git-cliff = "latest"
trivy = "0.74.0"

[tasks.build]
description = "Build without tests"
run = "mvn $MAVEN_CLI_OPTS package -Dmaven.test.skip=true"

[tasks.clean]
description = "Clean build project"
run = "mvn $MAVEN_CLI_OPTS clean"

[tasks.test]
description = "Unit tests (no e2e)"
run = "mvn $MAVEN_CLI_OPTS test -pl search-services/pristy-solrclient-lib,search-services/pristy-search,search-services/pristy-indexing-trackers -am"

[tasks.install]
description = "Install into the local Maven repo (no e2e)"
# 'clean' is required: a stale target/ (e.g. an old solr-core-8.11.4.jar left in
# the packaging libs) otherwise gets bundled into the assembled Solr webapp.
run = "mvn $MAVEN_CLI_OPTS clean install -DskipTests -pl search-services/pristy-solrclient-lib,search-services/pristy-search,search-services/packaging -am"

[tasks."e2e:build-image"]
description = "Build the local Docker image from the packaging module"
run = """
docker build -t jeci/pristy-search-services:local \
  search-services/packaging/target/docker-resources/
echo "Docker image built: jeci/pristy-search-services:local"
"""

[tasks."e2e:generate"]
description = "Generate the docker-compose stack for e2e tests"
dir = "e2e-test/python-generator"
run = """
python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=jeci/pristy-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --output=../../target/e2e-stack
echo "Stack generated in target/e2e-stack/"
echo "Start it with: mise run e2e:up"
"""

[tasks."e2e:rebuild"]
description = "Build, regenerate and restart the e2e stack (in the right order)"
run = """
echo "==> Maven build (no tests)..."
# 'clean' avoids bundling stale jars (e.g. an old solr-core) from a previous build.
mvn $MAVEN_CLI_OPTS clean package -Dmaven.test.skip=true
echo "==> Building the Solr image..."
docker build -t jeci/pristy-search-services:local search-services/packaging/target/docker-resources/
echo "==> Generating the e2e docker-compose (copies the fresh JARs)..."
cd e2e-test/python-generator && python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=jeci/pristy-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --output=../../target/e2e-stack
cd ../..
echo "==> Restarting the e2e stack..."
# --renew-anon-volumes: the search image declares VOLUME .../solrhome, so a reused
# anonymous volume would mask the freshly built template/config (cores are recreated
# from the template at startup).
docker compose -f target/e2e-stack/docker-compose.yml up --build --force-recreate --renew-anon-volumes -d
echo "==> e2e stack ready."
"""

[tasks."e2e:up"]
description = "Start the e2e stack (ACS + Solr + Postgres)"
run = "docker compose -f target/e2e-stack/docker-compose.yml up --build -d"

[tasks."e2e:down"]
description = "Stop the e2e stack"
run = "docker compose -f target/e2e-stack/docker-compose.yml down"

[tasks."e2e:logs"]
description = "Tail the e2e stack logs"
run = "docker compose -f target/e2e-stack/docker-compose.yml logs -f"

[tasks."e2e:test"]
description = "Run the e2e tests (the stack must be up)"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -De2e.skipTests=false"

[tasks."e2e:test:admin"]
description = "E2e admin tests only"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -De2e.skipTests=false -Dtest='SolrE2eAdminTest,SolrE2ESummaryTest,SolrE2eActionTest'"

[tasks."e2e:test:search"]
description = "E2e search tests (without admin)"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -De2e.skipTests=false -Dtest='SearchTest,SearchSimpleCasesTest,SearchCasesTest,SearchAFTSInFieldTest,SearchExactTermTest,SearchHighLightTest,SearchPermissionsTest,SearchQueryPaginationTest,SearchWithCustomModelTest,SpecialCharacterSearchTest'"

[tasks."e2e:test:facet"]
description = "E2e facet tests"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -De2e.skipTests=false -Dtest='FacetedSearchTest,FacetFieldsSearchTest,FacetIntervalSearchTest,FacetRangeSearchTest,PivotFacetedSearchTest,StatsSearchTest'"

[tasks."e2e:test:class"]
description = "Run a single e2e test class by name - e.g. mise run e2e:test:class MyTest"
run = "mvn $MAVEN_CLI_OPTS test -pl e2e-test -De2e.skipTests=false -Dtest='{{arg(name=\"class\")}}'"

[tasks."e2e:generate:https"]
description = "Generate docker-compose for the e2e stack with the Pristy https/mTLS (PKCS12) profile"
dir = "e2e-test/python-generator"
run = """
# Prerequisites: run the keystore generator first:
#   STORE_PASS=changeit keystore/generate-keystores.sh /tmp/mtls-out
# This produces solr.p12, trackers.p12, alfresco.p12 and truststore.p12 in /tmp/mtls-out.
python3 generator.py \
  --alfresco=alfresco/alfresco-content-repository-community:23.4.1 \
  --search=jeci/pristy-search-services:local \
  --postgres=postgres:16 \
  --transformer=AIOTransformers \
  --communication=https \
  --keystoreDir=/tmp/mtls-out \
  --output=../../target/e2e-stack-https
echo "https/mTLS stack generated in target/e2e-stack-https/"
echo "Start with: docker compose -f target/e2e-stack-https/docker-compose.yml up --build -d"
"""

[tasks."trackers:build"]
description = "Build trackers Spring Boot JAR"
# Run from the repo root (no `cd`): the license-maven-plugin resolves
# license-headers via ${maven.multiModuleProjectDirectory}, and with no .mvn/
# dir that property is the invocation dir. `cd search-services` would point it
# at search-services/license-headers (nonexistent) and break the build.
run = "mvn $MAVEN_CLI_OPTS package -pl search-services/pristy-indexing-trackers -am -Dmaven.test.skip=true"

[tasks."trackers:build-image"]
description = "Build the trackers Docker image from the JAR"
depends = ["trackers:build"]
# The Dockerfile lives outside the build context (packaging/src/docker), and the
# context is the module's target/ dir where the repackaged Spring Boot JAR sits
# (COPY pristy-indexing-trackers-*.jar). Mirrors the compose `trackers` service.
run = """
docker build -t jeci/pristy-indexing-trackers:local \
  -f search-services/packaging/src/docker/Dockerfile.trackers \
  search-services/pristy-indexing-trackers/target
echo "Docker image built: jeci/pristy-indexing-trackers:local"
"""

[tasks."trackers:run"]
description = "Run trackers locally"
# Run from the repo root — see trackers:build for why (license-headers path).
run = "mvn spring-boot:run -pl search-services/pristy-indexing-trackers"

[tasks."dev:acs-build"]
description = "Build the solr9 subsystem JAR and stage it into acs/assets for the ACS image"
# The ACS image build context is ./acs, so the freshly built subsystem JAR must be
# copied into acs/assets/ before `docker compose build`. The JAR is a git-ignored
# build artifact (see acs/assets/.gitignore).
run = """
mvn $MAVEN_CLI_OPTS package -pl search-services/pristy-search-subsystem-solr9 -am -Dmaven.test.skip=true
cp search-services/pristy-search-subsystem-solr9/target/pristy-search-subsystem-solr9.jar acs/assets/
echo "Staged pristy-search-subsystem-solr9.jar into acs/assets/"
"""

[tasks."dev:up"]
description = "Start development stack (Alfresco + Solr + Trackers)"
depends = ["dev:acs-build"]
run = "docker compose -f docker-compose.dev.yml up --build -d"

[tasks."dev:down"]
description = "Stop development stack"
run = "docker compose -f docker-compose.dev.yml down"

[tasks."dev:logs"]
description = "View development stack logs"
run = "docker compose -f docker-compose.dev.yml logs -f"

[tasks."changelog"]
description = "Generate CHANGELOG.md from git history"
run = "git cliff -o CHANGELOG.md"

[tasks."changelog:unreleased"]
description = "Show unreleased changes"
run = "git cliff --unreleased"

[tasks."changelog:tag"]
description = "Generate changelog for a specific tag (usage: mise run changelog:tag -- 1.0.0)"
run = "git-cliff --unreleased --prepend CHANGELOG.md --tag"

[tasks."sbom"]
description = "Generate CycloneDX SBOMs (runtime = what we ship, full = incl. provided)"
run = [
  "mvn -q -pl '!e2e-test' org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=bom-runtime -DincludeProvidedScope=false -DincludeTestScope=false",
  "mvn -q -pl '!e2e-test' org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=bom-full -DincludeProvidedScope=true -DincludeTestScope=false",
]

[tasks."audit"]
description = "Scan shipped dependencies for CVEs (fails on CRITICAL, same gate as CI)"
depends = ["sbom"]
run = "trivy sbom --quiet --severity CRITICAL --exit-code 1 target/bom-runtime.json"

[tasks."audit:full"]
description = "Report CVEs on the whole runtime tree, Solr and Alfresco included (never fails)"
depends = ["sbom"]
run = "trivy sbom --quiet --severity HIGH,CRITICAL target/bom-full.json"
